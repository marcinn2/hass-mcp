name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release"
        required: true
        type: string

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/test.yml

  create-release:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Validate version format
        run: |
          echo "${{ github.event.inputs.version }}" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "Invalid version format. Use vX.Y.Z (e.g., v1.2.3)."
            exit 1
          }

      - name: Configure Git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Set package version from tag
        run: |
          # uv build reads the version from pyproject.toml, so it must agree with
          # the tag; otherwise every release publishes the previous number.
          VERSION="${{ github.event.inputs.version }}"
          VERSION="${VERSION#v}"
          if [ "$(uv version --short)" != "$VERSION" ]; then
            uv version --no-sync "$VERSION"
            git commit -am "chore: release $VERSION"
            git push origin HEAD
          fi

      - name: Create and push Git tag
        run: |
          git tag ${{ github.event.inputs.version }}
          git push origin ${{ github.event.inputs.version }}

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.event.inputs.version }} \
            --title "${{ github.event.inputs.version }}" \
            --generate-notes \
            --draft=false

      - name: Release artifacts
        run: |
          echo "PyPI publishing is disabled; images are the release artifact."
          echo "Docker Build & Push builds from the pushed tag and publishes to:"
          echo "  ghcr.io/${{ github.repository }}:${{ github.event.inputs.version }}"
          echo "  ghcr.io/${{ github.repository }}:${{ github.event.inputs.version }}-vectordb"
