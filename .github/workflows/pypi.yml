name: Publish to PyPI (disabled)

# PyPI publishing is disabled. Distribution is via the GitHub Container
# Registry only: ghcr.io/marcinn2/hass-mcp (see docker.yml).
#
# The release trigger has been removed so publishing a GitHub release no longer
# pushes to PyPI. The workflow is kept rather than deleted so it can be revived:
# to re-enable, set the repository variable ENABLE_PYPI_PUBLISH to "true" and
# provide the PYPI_API_TOKEN secret.

on:
  workflow_dispatch:

jobs:
  test:
    if: vars.ENABLE_PYPI_PUBLISH == 'true'
    uses: ./.github/workflows/test.yml

  publish:
    name: Build and publish to PyPI
    needs: test
    if: vars.ENABLE_PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.13

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        run: uv publish
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
