name: Docker Build & Push

on:
  push:
    branches:
      - main
      - master
    tags:
      # Required for the semver tag patterns below to ever match.
      - 'v*'
    paths-ignore:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'README.md'
      - '.github/workflows/docs-*.yml'
  workflow_dispatch:

# Images are published to the GitHub Container Registry only.
env:
  REGISTRY: ghcr.io
  # Resolves to ghcr.io/<owner>/<repo>, i.e. ghcr.io/marcinn2/hass-mcp
  DOCKER_IMAGE: ghcr.io/${{ github.repository }}
  PLATFORMS: linux/amd64,linux/arm64

permissions:
  contents: read
  # Required to push to GHCR with the built-in GITHUB_TOKEN.
  packages: write

jobs:
  test:
    uses: ./.github/workflows/test.yml

  docker:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      # Parallelize builds for both images
      matrix:
        include:
          - dockerfile: Dockerfile
            tag_suffix: ""
            name: "base image (without VectorDB)"
            title: "Hass-MCP"
            description: "Home Assistant Model Context Protocol (MCP) server"
          - dockerfile: Dockerfile.vectordb
            tag_suffix: "-vectordb"
            name: "VectorDB image"
            title: "Hass-MCP (VectorDB)"
            description: "Home Assistant Model Context Protocol (MCP) server with VectorDB semantic entity search"
      fail-fast: false  # Continue building other images if one fails

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.DOCKER_IMAGE }}
          # org.opencontainers.image.source is what links the GHCR package to
          # this repository; the Dockerfiles set the same labels as a baseline.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.documentation=https://marcinn2.github.io/hass-mcp
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.licenses=MIT
          tags: |
            # Always include git sha for immutable references
            type=sha,format=long
            # Set latest tag for default branch
            type=raw,value=latest,enable={{is_default_branch}}
            # Tag branch builds (e.g. master)
            type=ref,event=branch
            # Full version numbers for exact versions
            type=semver,pattern={{version}}
            # Major.minor for API compatibility
            type=semver,pattern={{major}}.{{minor}}
            # Major only for major version compatibility
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Prepare tags with suffix
        id: tags
        run: |
          if [ -z "${{ matrix.tag_suffix }}" ]; then
            echo "tags<<EOF" >> $GITHUB_OUTPUT
            echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "tags<<EOF" >> $GITHUB_OUTPUT
            # Append suffix to each tag line (e.g. ghcr.io/marcinn2/hass-mcp:latest)
            echo "${{ steps.meta.outputs.tags }}" | sed "s|$|${{ matrix.tag_suffix }}|" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.dockerfile }}
          cache-to: type=gha,mode=max,scope=${{ matrix.dockerfile }}
