repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ['--unsafe']  # Allow Home Assistant !include directives
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: debug-statements
      - id: mixed-line-ending
      - id: requirements-txt-fixer

  # Keep in step with the ruff version in uv.lock: a mismatch makes
  # pre-commit and CI format differently and churn on every commit.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # MyPy is disabled in pre-commit hooks for now (38 pre-existing errors).
  # Type checking still runs in CI workflows (non-blocking).
  # TODO: Fix type annotations and re-enable MyPy here; keep rev in step with
  # the mypy version in uv.lock (currently 2.3.1) when re-enabling.
  # - repo: https://github.com/pre-commit/mirrors-mypy
  #   rev: v2.3.1
  #   hooks:
  #     - id: mypy
  #       args: [--ignore-missing-imports]
  #       files: ^app/

  # Keep in step with the bandit version in uv.lock.
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: [-c, pyproject.toml]
        files: ^app/

  # Note: Pytest is not included in pre-commit by default as it can be slow
  # Run tests manually: uv run pytest tests/
  # Or in CI: GitHub Actions will run tests automatically
